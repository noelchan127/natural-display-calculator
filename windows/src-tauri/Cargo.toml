[package]
name = "natural-display-calculator"
version = "1.0.0"
description = "Natural Display Calculator"
authors = ["Noel Chan"]
license = "GPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
