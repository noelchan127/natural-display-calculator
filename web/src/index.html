<!DOCTYPE html>
<!-- Natural Display Calculator. Copyright (C) 2026 Noel Chan. SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* apply a chosen Light/Dark theme before the page is drawn, so it never flashes the other one */
try{ var d=JSON.parse(localStorage.getItem('natcalc-v1')), t=d&&d.S&&d.S.theme; if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t); }catch(e){}
</script>
<title>Natural Display Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: a calculator body (LCD + keypad) on the left, a plotting bench on the right; one column with tabs on phones. */
:root{
  --bg:#e6ebf1; --chassis:#f6f8fa; --ink:#16202b; --muted:#5b6978; --line:#ccd5df;
  --lcd:#edf2e8; --lcd-ink:#0f1a13; --slot:#dfe7d8;
  --key:#ffffff; --key-fn:#dde5ee; --key-mod:#c9d4e1;
  --accent:#1f4fd8; --accent-ink:#ffffff; --shift:#b85a06; --danger:#b3261e;
  --plot-bg:#ffffff; --grid:#dfe5ec; --grid2:#eff2f6; --axis:#465260;
  --c1:#2456d6; --c2:#d1392b; --c3:#1d8a4e; --c4:#8a3fc4; --c5:#c77700;
  --math:"STIX Two Text","Cambria Math","Times New Roman",serif;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1216; --chassis:#161b21; --ink:#e6ebf0; --muted:#93a0ad; --line:#2b343e;
    --lcd:#1a221e; --lcd-ink:#e2efe5; --slot:#26312b;
    --key:#252d36; --key-fn:#1c232a; --key-mod:#303a46;
    --accent:#5b86ff; --accent-ink:#0b1020; --shift:#f0a04b; --danger:#ff7b72;
    --plot-bg:#11151a; --grid:#262e38; --grid2:#191f26; --axis:#9aa6b2;
    --c1:#6f9bff; --c2:#ff7a6b; --c3:#4fcf8a; --c4:#c08cff; --c5:#f0b040;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1216; --chassis:#161b21; --ink:#e6ebf0; --muted:#93a0ad; --line:#2b343e;
  --lcd:#1a221e; --lcd-ink:#e2efe5; --slot:#26312b;
  --key:#252d36; --key-fn:#1c232a; --key-mod:#303a46;
  --accent:#5b86ff; --accent-ink:#0b1020; --shift:#f0a04b; --danger:#ff7b72;
  --plot-bg:#11151a; --grid:#262e38; --grid2:#191f26; --axis:#9aa6b2;
  --c1:#6f9bff; --c2:#ff7a6b; --c3:#4fcf8a; --c4:#c08cff; --c5:#f0b040;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
button:focus-visible,.ed:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none !important}

.app{min-height:100%;display:grid;gap:10px;padding:12px 16px 16px;max-width:560px;margin:0 auto;
  grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;grid-template-areas:"head" "screen" "keys"}
.app[data-view="graph"]{grid-template-areas:"head" "graph" "keys"}
.app[data-view="graph"] .screen{display:none}
.app[data-view="calc"] .graph,.app[data-view="solve"] .graph,.app[data-view="solve"] .screen{display:none}
.app[data-view="solve"]{grid-template-areas:"head" "graph" "keys"}
.app[data-view="calc"] .solve,.app[data-view="graph"] .solve{display:none}
header{grid-area:head;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.01em}
.tabs{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabs button{border:0;background:var(--chassis);padding:6px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

/* LCD */
.screen{grid-area:screen;display:flex;flex-direction:column;background:var(--lcd);color:var(--lcd-ink);border:1px solid var(--line);border-radius:12px;min-height:230px;min-width:0;overflow:hidden}
.status{display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line);flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-weight:600;background:transparent;color:var(--lcd-ink);cursor:pointer;font-size:11.5px}
.chip.on{background:var(--shift);border-color:var(--shift);color:#fff}
.status .vars{font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:11.5px}
.hist{flex:1;overflow-y:auto;min-height:90px;max-height:210px;padding:4px 10px}
.hitem{padding:6px 0;border-bottom:1px dashed var(--line);font-family:var(--math);font-size:18px;line-height:1.25}
.hexpr{cursor:pointer;overflow-x:auto;white-space:nowrap;color:var(--muted)}
.hexpr:hover{color:var(--lcd-ink)}
.hres{text-align:right;font-size:22px;font-weight:600;overflow-x:auto;white-space:nowrap;padding-top:2px}
.tag{font-family:var(--ui);font-size:10px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-left:8px;vertical-align:middle}
.entry{border-top:1px solid var(--line);padding:6px 10px 4px}
.ed{font-family:var(--math);font-size:24px;line-height:1.25;white-space:nowrap;overflow-x:auto;overflow-y:hidden;cursor:text;min-height:44px;padding:6px 2px;border-radius:6px;outline:none;scrollbar-width:thin}
.err{min-height:18px;font-size:12px;color:var(--danger);padding:0 12px 6px}
.hint{font-size:11.5px;color:var(--muted);padding:0 12px 8px}

/* Natural display typesetting */
.row{display:inline-block;white-space:nowrap;padding:0 1.5px}
.rootrow{display:block;min-height:1.25em}
.row.empty{min-width:.7em;background:var(--slot);outline:1px dashed var(--muted);outline-offset:-1px;border-radius:2px}
.rootrow.empty{background:none;outline:0}
.ch.op{margin:0 .2em}
.ch.var{font-style:italic}
.ch.fnm{margin-left:.08em}
.ch.word{font-family:var(--ui);font-size:.72em;font-weight:500}
.frac{display:inline-block;overflow:hidden;text-align:center;margin:0 .12em;padding:0 .05em}
.frac>*{display:block;padding:0 .2em}
.frac>*:first-child{padding-bottom:1px}
.frac>*:last-child{border-top:1.5px solid currentColor;padding-top:1px}
.sqrt{display:inline-flex;margin:0 .06em;padding-top:2px}
.sqrt>.rad{align-self:stretch;width:.62em;position:relative;flex:none}
.sqrt>.rad svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sqrt>.radicand{align-self:baseline;border-top:1.3px solid currentColor;padding:1px .15em 0 .1em}
.sqrt>.ridx{align-self:flex-start;font-size:.6em;margin-right:-.5em;position:relative;z-index:1}
.abs{display:inline-flex;margin:0 .12em;border-left:1.5px solid currentColor;border-right:1.5px solid currentColor;padding:0 .12em}
.abs>.row{align-self:baseline}
.pow{display:inline-block;font-size:.68em;vertical-align:.5em}
.sub{font-size:.68em;vertical-align:-.35em}
.rec>.row{border-top:1.3px solid currentColor;padding:0;line-height:1.05}
.big{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .08em}
.big .sym{font-size:1.9em;line-height:1}
.big .col{display:flex;flex-direction:column;align-items:center;font-size:.62em;line-height:1.2}
.big .col .sym{font-size:2.6em}
.big .col .limw{font-size:1.6em;font-family:var(--math)}
.big .lims{align-self:stretch;justify-content:space-between;margin:0 .15em 0 -.1em}
.big .evalbar{align-self:stretch;border-left:1.3px solid currentColor;margin:0 .12em 0 .18em}
.big .at{align-self:flex-end;font-size:.68em}
.mat{display:inline-grid;gap:.15em .7em;vertical-align:middle;position:relative;padding:.1em .45em;margin:0 .15em;justify-items:center;align-items:center}
.mat::before,.mat::after{content:"";position:absolute;top:0;bottom:0;width:.3em;border:1.5px solid currentColor}
.mat::before{left:0;border-right:0}
.mat::after{right:0;border-left:0}
.caret{display:inline-block;width:0;height:1.05em;border-left:2px solid var(--accent);margin-right:-2px;vertical-align:-.16em;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.caret{animation:none}}

/* Keypad */
.keys{grid-area:keys;display:flex;flex-direction:column;gap:8px;background:var(--chassis);border:1px solid var(--line);border-radius:12px;padding:10px}
.kgrid{display:grid;gap:5px}
.kgrid.sci{grid-template-columns:repeat(6,minmax(0,1fr))}
.kgrid.num{grid-template-columns:repeat(5,minmax(0,1fr))}
.k{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--key-fn);height:42px;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow:hidden}
.kgrid.num .k{background:var(--key);height:48px}
.k:active{transform:translateY(1px);filter:brightness(.95)}
.k .k1{font-size:14px}
.kgrid.num .k .k1{font-size:18px}
.k .k2{font-size:9.5px;color:var(--shift);height:11px;margin-top:-2px;margin-bottom:1px;font-weight:600;white-space:nowrap}
.kgrid .k.mod{background:var(--key-mod);font-weight:600}
.kgrid .k.eq{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kgrid .k.eq .k2{color:var(--accent-ink);opacity:.85}
.k.del{color:var(--danger);font-weight:600}
.kgrid .k.on{background:var(--shift);color:#fff;border-color:var(--shift)}
.keys.shift .k.has2 .k1{opacity:.35}
.keys.shift .k.has2 .k2{font-size:12px;height:13px}
.k sup,.k sub{font-size:.7em}
.kfrac{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.kfrac i{width:7px;height:6px;border:1px solid currentColor;display:block}
.kfrac b{width:13px;border-top:1.5px solid currentColor;display:block}
.kfrac.sm{gap:1px;vertical-align:middle;margin-left:2px}
.kfrac.sm i{width:5px;height:4px}
.kfrac.sm b{width:9px;border-top-width:1px}
.k .ph{display:inline-block;box-sizing:border-box;width:.56em;height:.66em;border:1.2px solid currentColor;border-radius:1.5px;vertical-align:-.05em;margin:0 .05em;font-style:normal}
.k sup .ph,.k sub .ph{border-width:1px;width:max(.72em,5px);height:max(.82em,6px);vertical-align:0}
.khide{display:none;align-self:center;border:1px solid var(--line);background:var(--key-mod);border-radius:999px;padding:3px 14px;font-size:12px;font-weight:600;cursor:pointer;margin:-2px 0 0}
.kmat{display:inline-grid;grid-template-columns:5px 5px;gap:2px;padding:1px 4px;border-left:1.5px solid currentColor;border-right:1.5px solid currentColor}
.kmat i{width:5px;height:5px;border:1px solid currentColor;display:block}

/* Graph */
.graph{grid-area:graph;display:flex;flex-direction:column;gap:8px;min-width:0}
.fnpanel{background:var(--chassis);border:1px solid var(--line);border-radius:12px;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.fn{display:flex;align-items:center;gap:8px;border-bottom:1px dashed var(--line);padding:2px 0}
.fn .sw{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--c);background:transparent;cursor:pointer;padding:0}
.fn .sw[aria-pressed="true"]{background:var(--c)}
.fn .fnlab{flex:none;font-family:var(--math);font-style:italic;font-size:18px}
.fn .ed{flex:1;min-width:0;font-size:20px;min-height:36px;padding:4px 2px}
.fn .ed.active{background:var(--plot-bg)}
.fn .warn{display:none;color:var(--danger);font-size:11.5px;flex:none}
.fn.bad .warn{display:inline}
.fn .fndel{flex:none;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;width:28px;height:28px;border-radius:6px}
.fn .fndel:hover{color:var(--danger)}
.fnbar{display:flex;align-items:center;gap:10px;padding-top:4px}
.btn{border:1px solid var(--line);background:var(--key);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.btn.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fnbar .note{font-size:11.5px;color:var(--muted)}
.plotwrap{position:relative;flex:1;min-height:320px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--plot-bg)}
.plotwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#over{touch-action:none;cursor:crosshair}
.ptools{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.ptools .btn{min-width:30px;padding:4px 8px;background:var(--chassis)}
.win{position:absolute;top:44px;right:8px;background:var(--chassis);border:1px solid var(--line);border-radius:8px;padding:10px;display:none;grid-template-columns:auto 84px auto 84px;gap:6px 8px;align-items:center;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.win.open{display:grid}
.win input,.tbody input,.tbody select,.tbody textarea{font-variant-numeric:tabular-nums;padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--plot-bg);color:var(--ink)}
.win input{width:100%}
.win .presets{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}

/* Tools panel */
.tools{position:fixed;inset:0;background:rgba(10,14,20,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.tpanel{background:var(--chassis);border:1px solid var(--line);border-radius:12px;width:min(560px,100%);max-height:min(640px,100%);display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.thead{display:flex;align-items:flex-start;gap:8px;padding:10px;border-bottom:1px solid var(--line)}
.ttabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.tbody{padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;font-size:13px}
.tbody h2{font-size:12px;font-weight:600;margin:4px 0 0;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tbody p{margin:0;color:var(--muted);font-size:12px;max-width:65ch}
.trow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.trow>label,.trow>.lab{min-width:120px}
.clist{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,auto);gap:0;font-variant-numeric:tabular-nums}
.clist button{display:contents;cursor:pointer}
.clist button>span{padding:5px 8px;border-bottom:1px dashed var(--line);text-align:left}
.clist button:hover>span{background:var(--key-fn)}
.clist .sym{font-family:var(--math);font-style:italic;font-size:15px}
.clist .val{text-align:right;overflow-wrap:anywhere}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat textarea{width:100%;min-height:200px;resize:vertical}
@media (max-width:480px){.stat{grid-template-columns:1fr}}

@media (max-width:360px){.kgrid.sci .k .k1{font-size:12px}}
/* Phones and portrait tablets: fit everything on one screen with the keypad always in reach.
   On the Graph and Solve tabs the keypad opens when you tap an entry box and can be hidden again. */
@media (max-width:899px){
  .app{height:100%;min-height:480px;padding:8px 10px 10px;gap:8px;grid-template-rows:auto minmax(0,1fr) auto}
  .screen{min-height:0}
  .hist{min-height:36px;max-height:none}
  .status{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .status::-webkit-scrollbar{display:none}
  .status .vars{min-width:40px}
  .status .chip,.status .linkbtn{flex:none}
  .graph{min-height:0;overflow-y:auto}
  .plotwrap{min-height:150px}
  .keys{padding:8px;gap:6px}
  .k{height:clamp(30px,5vh,44px);height:clamp(30px,5dvh,44px)}
  .kgrid.num .k{height:clamp(34px,5.8vh,52px);height:clamp(34px,5.8dvh,52px)}
  .app[data-view="graph"]:not(.kbd) .keys,.app[data-view="solve"]:not(.kbd) .keys{display:none}
  .app[data-view="graph"] .khide,.app[data-view="solve"] .khide{display:block}
  .smath.res{font-size:19px}
  .app.kbd .fnbar .note{display:none}
  .app.kbd .fn .ed{min-height:30px;padding:2px}
}
@media (max-width:600px){
  h1{display:none}
  .tabs{margin-left:0;flex:1}
  .tabs button{flex:1;padding:7px 6px}
}
@media (hover:none){.hint{display:none}}
@media (min-width:900px){
  .app{max-width:none;height:100%;min-height:700px;grid-template-columns:minmax(380px,440px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head head" "screen graph" "keys graph"}
  .app[data-view] .screen,.app[data-view] .graph{display:flex}
  .app[data-view="solve"] .graph{display:none}
  .app[data-view]{grid-template-areas:"head head" "screen graph" "keys graph"}
  #tabCalc{display:none}
  .app[data-view="calc"] #tabGraph{background:var(--accent);color:var(--accent-ink)}
  .hist{max-height:none}
  .k{height:38px}
  .kgrid.num .k{height:44px}
  .screen{min-height:200px}
}
@media (min-width:900px) and (max-height:820px){
  .k{height:34px}
  .kgrid.num .k{height:38px}
}

/* Solve view */
.solve{grid-area:graph;display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.sbar{display:flex;gap:4px;flex-wrap:wrap;background:var(--chassis);border:1px solid var(--line);border-radius:12px;padding:8px}
.sbody{flex:1;min-height:0;overflow-y:auto;background:var(--chassis);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px}
.sinput{display:flex;flex-direction:column;gap:8px}
.sinput,.sout{min-width:0}
.sfield{display:flex;flex-direction:column;gap:3px}
.sfield .lab,.sinput label{font-size:12px;color:var(--muted)}
.sinput .trow>label{min-width:0}
.sed{border:1px solid var(--line);background:var(--plot-bg);padding:6px 8px;font-size:22px}
.sed.active{border-color:var(--accent)}
.sfield.small .sed{font-size:18px;min-height:36px}
.slims{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sinput input,.sinput select{padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--plot-bg);color:var(--ink);font-variant-numeric:tabular-nums}
.btn.go{background:var(--key-fn);font-weight:500}
.mgrid{display:grid;gap:4px;justify-content:start}
.mgrid input{width:100%;text-align:center}
.gfields{display:grid;grid-template-columns:auto minmax(80px,140px);gap:6px 10px;align-items:center;justify-content:start}
.sout h3{font-size:12px;font-weight:600;margin:12px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.smath{font-family:var(--math);font-size:18px;line-height:1.25;overflow-x:auto;white-space:nowrap;padding:4px 0}
.smath.res{font-size:22px;padding:8px 10px;background:var(--plot-bg);border:1px solid var(--line);border-radius:8px}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.steps li{padding-left:4px}
.steps li.shead{list-style:none;margin-left:-22px;font-weight:600}
.slabel{font-size:13px;max-width:65ch}
.snote,.sbody p{font-size:12px;color:var(--muted);margin:6px 0 0;max-width:65ch}
.serr{color:var(--danger);font-size:13px;margin:0}
.gtable{display:grid;grid-template-columns:auto auto;gap:4px 16px;justify-content:start;font-variant-numeric:tabular-nums}
.gsvg{margin-top:10px;overflow-x:auto}
.gsvg text{font:11px var(--ui);fill:currentColor}
.abt-title{font-size:20px;font-weight:600;margin:2px 0 0}
.abt-ver{color:var(--muted);margin:2px 0 12px}
.abt-line{margin:4px 0}
.abt-line a{color:var(--accent,#2350d6);font-weight:500}
.abt-gap{margin-top:12px}
.abt-grey{color:var(--muted);font-size:13px;margin:4px 0}
.abt-copy{margin-top:12px;width:auto;align-self:flex-start;display:inline-block}
.lictext{white-space:pre-wrap;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-height:50vh;overflow:auto;background:var(--bg);border:1px solid var(--line);padding:10px 12px;border-radius:8px;margin:8px 0 0}
.srcurl{user-select:all;-webkit-user-select:all;font-weight:500}
</style>
</head>
<body>
<div class="app" id="app" data-view="calc">
  <header>
    <h1>Natural Display Calculator</h1>
    <div class="tabs" role="tablist">
      <button id="tabCalc" role="tab" aria-selected="true">Calculate</button>
      <button id="tabGraph" role="tab" aria-selected="false">Graph</button>
      <button id="tabSolve" role="tab" aria-selected="false">Solve</button>
    </div>
  </header>

  <section class="screen" aria-label="Calculator display">
    <div class="status">
      <button class="chip" id="angleChip" title="Switch between degrees, radians and gradians">DEG</button>
      <button class="chip" id="modeChip" title="Show answers as fractions, roots and multiples of π, or as decimals">Answers: exact</button>
      <button class="chip" id="fmtChip" title="Number format: normal, fixed decimals, scientific or engineering">NORM</button>
      <button class="chip" id="cplxChip" title="Complex mode: roots and logs of negative numbers give complex answers">CPLX off</button>
      <span class="chip on" id="hypChip" hidden>hyp</span>
      <span class="chip on" id="stoChip" hidden>STO → pick A–D, x, y or M</span>
      <span class="vars" id="vars"></span>
      <button class="linkbtn" id="clearHist" title="Clear history">Clear</button>
    </div>
    <div class="hist" id="hist"></div>
    <div class="entry"><div class="ed" id="mainEd" tabindex="0" aria-label="Expression entry"></div></div>
    <div class="err" id="err" role="alert"></div>
    <div class="hint">Keyboard works too: type sin, sqrt, pi, abs, lim; <b>/</b> makes a fraction, <b>^</b> a power, Enter evaluates.</div>
  </section>

  <section class="graph" aria-label="Graph">
    <div class="fnpanel">
      <div id="fnlist"></div>
      <div class="fnbar">
        <button class="btn" id="addFn">Add function</button>
        <span class="note">Drag to pan, scroll or pinch to zoom. Hover or tap a curve to read a point.</span>
      </div>
    </div>
    <div class="plotwrap" id="plotwrap">
      <canvas id="plot"></canvas>
      <canvas id="over"></canvas>
      <div class="ptools">
        <button class="btn" id="zin" title="Zoom in">+</button>
        <button class="btn" id="zout" title="Zoom out">−</button>
        <button class="btn" id="zhome" title="Reset to ±10 with equal scales">Home</button>
        <button class="btn" id="zwin" title="Set the window by numbers">Window</button>
      </div>
      <div class="win" id="win">
        <label for="wx0">x min</label><input id="wx0" inputmode="decimal">
        <label for="wx1">x max</label><input id="wx1" inputmode="decimal">
        <label for="wy0">y min</label><input id="wy0" inputmode="decimal">
        <label for="wy1">y max</label><input id="wy1" inputmode="decimal">
        <div class="presets">
          <button class="btn" id="pTrig">Trig window</button>
          <button class="btn" id="pSquare">Equal scales</button>
        </div>
      </div>
    </div>
  </section>

  <section class="solve" id="solve" aria-label="Step-by-step calculators"></section>

  <section class="keys" id="keys" aria-label="Keypad">
    <button class="khide" id="khide" type="button">Hide keypad ▾</button>
    <div class="kgrid sci" id="ksci"></div>
    <div class="kgrid num" id="knum"></div>
  </section>
</div>

<div class="tools" id="tools" hidden>
  <div class="tpanel" role="dialog" aria-label="Menu">
    <div class="thead"><div class="ttabs" id="ttabs"></div><button class="btn" id="tclose">Close</button></div>
    <div class="tbody" id="tbody"></div>
  </div>
</div>

<script id="engine">
/* ---------- math engine (no DOM) ---------- */
const V={x:0,y:0,A:0,B:0,C:0,D:0,M:0,Ans:0};
const S={ang:'deg',cplx:false,polar:false,fmt:'norm',digits:4,mixed:false,dec:false,haptic:true,theme:'system'};
let CMODE=false;
const KIDS={frac:['a','b'],sqrt:['a'],root:['n','a'],pow:['a'],abs:['a'],logb:['b','a'],int:['lo','hi','a'],ddx:['a','x'],sum:['lo','hi','a'],prod:['lo','hi','a'],lim:['x','a'],mix:['w','a','b'],rec:['a']};
const kidsOf=n=>n.t==='mat'?n.cells:(KIDS[n.t]||[]).map(k=>n[k]);
const C=v=>({t:'c',v:String(v)});
const chars=s=>String(s).split('').map(C);
class CalcError extends Error{constructor(kind){super(kind);this.kind=kind;}}
const synErr=()=>new CalcError('syntax');
const dimErr=()=>new CalcError('dim');

function ser(row){
  let s='';
  for(const n of row){
    switch(n.t){
      case 'c': s+=n.v==='mod'?' mod ':n.v; break;
      case 'frac': s+='(('+ser(n.a)+')/('+ser(n.b)+'))'; break;
      case 'mix': s+='(('+ser(n.w)+')+(('+ser(n.a)+')/('+ser(n.b)+')))'; break;
      case 'sqrt': s+='sqrt('+ser(n.a)+')'; break;
      case 'root': s+='nroot('+ser(n.n)+','+ser(n.a)+')'; break;
      case 'pow': s+='^('+ser(n.a)+')'; break;
      case 'abs': s+='abs('+ser(n.a)+')'; break;
      case 'rec': s+='r('+ser(n.a)+')'; break;
      case 'logb': s+='logb('+ser(n.b)+','+ser(n.a)+')'; break;
      case 'int': s+='int('+ser(n.a)+','+ser(n.lo)+','+ser(n.hi)+')'; break;
      case 'ddx': s+='diff('+ser(n.a)+','+ser(n.x)+')'; break;
      case 'sum': s+='sum('+ser(n.a)+','+ser(n.lo)+','+ser(n.hi)+')'; break;
      case 'prod': s+='prod('+ser(n.a)+','+ser(n.lo)+','+ser(n.hi)+')'; break;
      case 'lim': s+='lim('+ser(n.a)+','+ser(n.x)+')'; break;
      case 'mat': s+='mat('+n.r+','+n.c+','+n.cells.map(c=>'('+ser(c)+')').join(',')+')'; break;
    }
  }
  let d=0; for(const ch of s){ if(ch==='(')d++; else if(ch===')')d--; }
  while(d-->0) s+=')';
  return s;
}

const NAMES=['asinh','acosh','atanh','asin','acos','atan','sinh','cosh','tanh','sin','cos','tan','sec','csc','cot','sqrt','nroot','logb','log','ln','abs','int','diff','sum','prod','lim','nCr','nPr','Ans','pi','mod','mat','det','trn','inv','tr','identity','floor','ceil','round','sign','ipart','fpart','gcd','lcm','min','max','randint','re','im','arg','conj','Ran#'].sort((a,b)=>b.length-a.length);
function tokenize(s){
  const t=[]; let i=0;
  while(i<s.length){
    const c=s[i];
    if(c===' '){i++;continue;}
    const m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));
    if(m){
      let v=parseFloat(m[0]); i+=m[0].length;
      if(s[i]==='.') throw synErr();
      if(s.startsWith('r(',i)){
        const m2=/^r\((\d+)\)/.exec(s.slice(i)); if(!m2) throw synErr();
        const dec=(m[0].split('.')[1]||'').length;
        v+=parseInt(m2[1],10)/(Math.pow(10,dec)*(Math.pow(10,m2[1].length)-1)); i+=m2[0].length;
      }
      if(s[i]==='°'){
        i++; let mm=/^(\d+\.?\d*)′/.exec(s.slice(i)); if(mm){ v+=parseFloat(mm[1])/60; i+=mm[0].length; }
        mm=/^(\d+\.?\d*)″/.exec(s.slice(i)); if(mm){ v+=parseFloat(mm[1])/3600; i+=mm[0].length; }
      }
      t.push({k:'n',v}); continue;
    }
    const nm=NAMES.find(n=>s.startsWith(n,i));
    if(nm){ t.push(nm==='mod'?{k:'o',v:'mod'}:{k:'id',v:nm}); i+=nm.length; continue; }
    if('xyeiABCDMπ∞'.includes(c)){ t.push({k:'id',v:c}); i++; continue; }
    const op={'×':'*','÷':'/','−':'-'}[c]||c;
    if('+-*/^!(),%∠=<>≤≥≠'.includes(op)){ t.push({k:'o',v:op}); i++; continue; }
    throw synErr();
  }
  return t;
}

/* value kinds: number, boolean, complex {re,im}, matrix {m:[[..]]} */
const isN=v=>typeof v==='number', isC=v=>v!=null&&v.re!==undefined, isM=v=>v!=null&&v.m!==undefined;
const num=v=>typeof v==='boolean'?+v:v;
const cx=(re,im)=>im===0?re:{re,im};
const RE=v=>isN(v)?v:v.re, IM=v=>isN(v)?0:v.im;
const cmul=(a,b)=>cx(RE(a)*RE(b)-IM(a)*IM(b),RE(a)*IM(b)+IM(a)*RE(b));
const cdiv=(a,b)=>{ const d=RE(b)*RE(b)+IM(b)*IM(b); return cx((RE(a)*RE(b)+IM(a)*IM(b))/d,(IM(a)*RE(b)-RE(a)*IM(b))/d); };
const cadd=(a,b,s=1)=>cx(RE(a)+s*RE(b),IM(a)+s*IM(b));
const cabs=a=>Math.hypot(RE(a),IM(a)), carg=a=>Math.atan2(IM(a),RE(a));
const cexp=a=>{ const e=Math.exp(RE(a)); return cx(e*Math.cos(IM(a)),e*Math.sin(IM(a))); };
const cln=a=>cx(Math.log(cabs(a)),carg(a));
const cpow=(a,b)=>cabs(a)===0?(RE(b)>0?0:NaN):cexp(cmul(b,cln(a)));
const csqrt=a=>{ const r=cabs(a), re=Math.sqrt((r+RE(a))/2), im=Math.sqrt((r-RE(a))/2); return cx(re,IM(a)<0?-im:im); };
const csin=a=>cx(Math.sin(RE(a))*Math.cosh(IM(a)),Math.cos(RE(a))*Math.sinh(IM(a)));
const ccos=a=>cx(Math.cos(RE(a))*Math.cosh(IM(a)),-Math.sin(RE(a))*Math.sinh(IM(a)));
const csinh=a=>cx(Math.sinh(RE(a))*Math.cos(IM(a)),Math.cosh(RE(a))*Math.sin(IM(a)));
const ccosh=a=>cx(Math.cosh(RE(a))*Math.cos(IM(a)),Math.sinh(RE(a))*Math.sin(IM(a)));
const I={re:0,im:1};
const casin=z=>cmul({re:0,im:-1},cln(cadd(cmul(I,z),csqrt(cadd(1,cmul(z,z),-1)))));
const cacos=z=>cadd(Math.PI/2,casin(z),-1);
const catan=z=>cmul({re:0,im:0.5},cadd(cln(cadd(1,cmul(I,z),-1)),cln(cadd(1,cmul(I,z))),-1));
const casinh=z=>cln(cadd(z,csqrt(cadd(cmul(z,z),1))));
const cacosh=z=>cln(cadd(z,cmul(csqrt(cadd(z,1)),csqrt(cadd(z,-1)))));
const catanh=z=>cmul(0.5,cadd(cln(cadd(1,z)),cln(cadd(1,z,-1)),-1));

function ident(n){ return {m:Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>+(i===j)))}; }
function mdet(a){
  const n=a.m.length; if(n!==a.m[0].length) throw dimErr();
  const m=a.m.map(r=>r.slice()); let d=1;
  for(let c=0;c<n;c++){
    let p=c; for(let r=c+1;r<n;r++) if(Math.abs(m[r][c])>Math.abs(m[p][c])) p=r;
    if(m[p][c]===0) return 0;
    if(p!==c){ [m[p],m[c]]=[m[c],m[p]]; d=-d; }
    d*=m[c][c];
    for(let r=c+1;r<n;r++){ const f=m[r][c]/m[c][c]; for(let k=c;k<n;k++) m[r][k]-=f*m[c][k]; }
  }
  return d;
}
function minv(a){
  const n=a.m.length; if(n!==a.m[0].length) throw dimErr();
  const m=a.m.map((r,i)=>[...r,...ident(n).m[i]]);
  for(let c=0;c<n;c++){
    let p=c; for(let r=c+1;r<n;r++) if(Math.abs(m[r][c])>Math.abs(m[p][c])) p=r;
    if(Math.abs(m[p][c])<1e-14) throw new CalcError('math');
    [m[p],m[c]]=[m[c],m[p]];
    const d=m[c][c]; for(let k=0;k<2*n;k++) m[c][k]/=d;
    for(let r=0;r<n;r++) if(r!==c){ const f=m[r][c]; if(f) for(let k=0;k<2*n;k++) m[r][k]-=f*m[c][k]; }
  }
  return {m:m.map(r=>r.slice(n))};
}
function add(a,b,s=1){
  a=num(a); b=num(b);
  if(isN(a)&&isN(b)){ const r=a+s*b; return Math.abs(r)<4*Number.EPSILON*Math.max(Math.abs(a),Math.abs(b))?0:r; }
  if(isM(a)||isM(b)){
    if(!isM(a)||!isM(b)||a.m.length!==b.m.length||a.m[0].length!==b.m[0].length) throw dimErr();
    return {m:a.m.map((r,i)=>r.map((v,j)=>v+s*b.m[i][j]))};
  }
  return cadd(a,b,s);
}
function mul(a,b){
  a=num(a); b=num(b);
  if(isN(a)&&isN(b)) return a*b;
  if(isM(a)&&isM(b)){
    if(a.m[0].length!==b.m.length) throw dimErr();
    return {m:a.m.map(r=>b.m[0].map((_,j)=>r.reduce((t,v,k)=>t+v*b.m[k][j],0)))};
  }
  if(isM(a)||isM(b)){ const [M,k]=isM(a)?[a,b]:[b,a]; if(!isN(k)) throw dimErr(); return {m:M.m.map(r=>r.map(v=>v*k))}; }
  return cmul(a,b);
}
function div(a,b){
  a=num(a); b=num(b);
  if(isN(a)&&isN(b)) return a/b;
  if(isM(b)) return mul(a,minv(b));
  if(isM(a)){ if(!isN(b)) throw dimErr(); return mul(a,1/b); }
  return cdiv(a,b);
}
const neg=a=>isN(a)?-a:mul(a,-1);

function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a; }
function ratApprox(v,maxDen,tol){
  const sign=v<0?-1:1, x=Math.abs(v);
  let h0=0,h1=1,k0=1,k1=0,y=x;
  for(let i=0;i<40;i++){
    const a=Math.floor(y), h2=a*h1+h0, k2=a*k1+k0;
    if(k2>maxDen||h2>1e10) break;
    h0=h1;h1=h2;k0=k1;k1=k2;
    if(Math.abs(x-h1/k1)<=tol*Math.max(1,x)) return [sign*h1,k1];
    const fr=y-a; if(fr<1e-15) break; y=1/fr;
  }
  return null;
}
const LG=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
function gamma(z){
  if(z<0.5) return Math.PI/(Math.sin(Math.PI*z)*gamma(1-z));
  z-=1; let x=LG[0]; for(let i=1;i<9;i++) x+=LG[i]/(z+i);
  const t=z+7.5; return Math.sqrt(2*Math.PI)*Math.pow(t,z+0.5)*Math.exp(-t)*x;
}
function fact(x){
  x=num(x); if(!isN(x)) return NaN;
  if(Number.isInteger(x)){ if(x<0) return NaN; if(x>170) return Infinity; let r=1; for(let i=2;i<=x;i++) r*=i; return r; }
  return gamma(x+1);
}
function pw(a,b){
  if(a<0&&!Number.isInteger(b)){
    const r=ratApprox(b,99,1e-13);
    if(r&&r[1]%2===1) return (Math.abs(r[0])%2===0?1:-1)*Math.pow(-a,b);
  }
  return Math.pow(a,b);
}
function powv(a,b){
  a=num(a); b=num(b);
  if(isN(a)&&isN(b)){ const r=pw(a,b); return (Number.isNaN(r)&&CMODE&&!Number.isNaN(a)&&!Number.isNaN(b))?cpow(a,b):r; }
  if(isM(a)){
    if(!isN(b)||!Number.isInteger(b)||a.m.length!==a.m[0].length) throw dimErr();
    let base=b<0?minv(a):a, n=Math.abs(b), r=ident(a.m.length);
    while(n){ if(n&1) r=mul(r,base); base=mul(base,base); n>>=1; }
    return r;
  }
  if(isM(b)) throw dimErr();
  if(isN(b)&&Number.isInteger(b)&&Math.abs(b)<=1024){
    let base=b<0?cdiv(1,a):a, n=Math.abs(b), r=1;
    while(n){ if(n&1) r=cmul(r,base); base=cmul(base,base); n>>=1; }
    return r;
  }
  return cpow(a,b);
}
function nrootR(n,a){
  if(a<0&&Number.isInteger(n)&&Math.abs(n)%2===1) return -Math.pow(-a,1/n);
  return Math.pow(a,1/n);
}
function nCr(n,r){ if(!Number.isInteger(n)||!Number.isInteger(r)||r<0||n<r) return NaN; r=Math.min(r,n-r); let v=1; for(let i=1;i<=r;i++) v=v*(n-r+i)/i; return Math.round(v); }
function nPr(n,r){ if(!Number.isInteger(n)||!Number.isInteger(r)||r<0||n<r) return NaN; let v=1; for(let i=0;i<r;i++) v*=n-i; return v; }
const kAng=()=>S.ang==='deg'?Math.PI/180:S.ang==='grad'?Math.PI/200:1;
const toRad=x=>S.ang==='rad'?x:(x%(S.ang==='deg'?360:400))*kAng();
const snap=(v,a)=>(Math.abs(v)<1e-15&&Math.abs(a)>1e-8)?0:v;
const sinR=x=>{ const a=toRad(x); return snap(Math.sin(a),a); };
const cosR=x=>{ const a=toRad(x); return snap(Math.cos(a),a); };
/* R1: real function with a complex fallback when complex mode is on; R0: real numbers only */
const R1=(real,cplx)=>x=>{ x=num(x);
  if(isN(x)){ const r=real(x); return (Number.isNaN(r)&&CMODE&&!Number.isNaN(x))?cplx(x):r; }
  if(isC(x)) return cplx(x); throw dimErr(); };
const R0=f=>(...a)=>{ a=a.map(num); return a.every(isN)?f(...a):NaN; };
const mustM=f=>a=>{ if(!isM(a)) throw dimErr(); return f(a); };
const F={
  sin:[1,R1(sinR,z=>csin(cmul(z,kAng())))],
  cos:[1,R1(cosR,z=>ccos(cmul(z,kAng())))],
  tan:[1,R1(x=>sinR(x)/cosR(x),z=>{ const w=cmul(z,kAng()); return cdiv(csin(w),ccos(w)); })],
  asin:[1,R1(x=>Math.asin(x)/kAng(),z=>cmul(casin(z),1/kAng()))],
  acos:[1,R1(x=>Math.acos(x)/kAng(),z=>cmul(cacos(z),1/kAng()))],
  atan:[1,R1(x=>Math.atan(x)/kAng(),z=>cmul(catan(z),1/kAng()))],
  sec:[1,R0(x=>1/cosR(x))], csc:[1,R0(x=>1/sinR(x))], cot:[1,R0(x=>cosR(x)/sinR(x))],
  sinh:[1,R1(Math.sinh,csinh)], cosh:[1,R1(Math.cosh,ccosh)], tanh:[1,R1(Math.tanh,z=>cdiv(csinh(z),ccosh(z)))],
  asinh:[1,R1(Math.asinh,casinh)], acosh:[1,R1(Math.acosh,cacosh)], atanh:[1,R1(Math.atanh,catanh)],
  sqrt:[1,R1(Math.sqrt,csqrt)], ln:[1,R1(Math.log,cln)], log:[1,R1(Math.log10,z=>cdiv(cln(z),Math.LN10))],
  abs:[1,x=>{ x=num(x); return isN(x)?Math.abs(x):isC(x)?cabs(x):NaN; }],
  logb:[2,(b,a)=>div(F.ln[1](a),F.ln[1](b))],
  nroot:[2,(n,a)=>{ n=num(n); a=num(a); if(isN(n)&&isN(a)){ const r=nrootR(n,a); return (Number.isNaN(r)&&CMODE)?cpow(a,1/n):r; } return powv(a,div(1,n)); }],
  nCr:[2,R0(nCr)], nPr:[2,R0(nPr)],
  floor:[1,R0(Math.floor)], ceil:[1,R0(Math.ceil)], round:[1,R0(Math.round)], sign:[1,R0(Math.sign)],
  ipart:[1,R0(Math.trunc)], fpart:[1,R0(x=>x-Math.trunc(x))],
  gcd:[2,R0((a,b)=>Number.isInteger(a)&&Number.isInteger(b)?gcd(a,b):NaN)],
  lcm:[2,R0((a,b)=>Number.isInteger(a)&&Number.isInteger(b)&&a&&b?Math.abs(a*b)/gcd(a,b):NaN)],
  min:[2,R0(Math.min)], max:[2,R0(Math.max)],
  randint:[2,R0((a,b)=>Math.floor(a+Math.random()*(b-a+1)))],
  re:[1,x=>RE(num(x))], im:[1,x=>IM(num(x))], arg:[1,x=>carg(num(x))/kAng()], conj:[1,x=>cx(RE(num(x)),-IM(num(x)))],
  det:[1,mustM(mdet)], inv:[1,mustM(minv)], trn:[1,mustM(a=>({m:a.m[0].map((_,j)=>a.m.map(r=>r[j]))}))],
  tr:[1,mustM(a=>{ if(a.m.length!==a.m[0].length) throw dimErr(); return a.m.reduce((t,r,i)=>t+r[i],0); })],
  identity:[1,R0(n=>{ if(!Number.isInteger(n)||n<1||n>8) throw dimErr(); return ident(n); })],
  mat:[-1,(r,c,...v)=>{ if(v.length!==r*c||!v.every(x=>isN(num(x)))) throw dimErr(); const m=[]; for(let i=0;i<r;i++) m.push(v.slice(i*c,i*c+c).map(num)); return {m}; }]
};

const XK=[0.991455371120812639,0.949107912342758525,0.864864423359769073,0.741531185599394440,0.586087235467691130,0.405845151377397167,0.207784955007898468];
const WK=[0.022935322010529225,0.063092092629978553,0.104790010322250184,0.140653259715525919,0.169004726639267903,0.190350578064785410,0.204432940075298892,0.209482141084727828];
const WG=[0.129484966168869693,0.279705391489276668,0.381830050505118945,0.417959183673469388];
function gk15(f,a,b){

function fix(roots){

  const levels=[], walk=(e,d)=>{ for(const ch of e.children) walk(ch,d+1); const f=e.classList.contains('frac'), p=!f&&e.classList.contains('pow'); if(f||p) (levels[d]=levels[d]||{fr:[],pw:[]})[f?'fr':'pw'].push(e); };

    const L=levels[d]; if(!L) continue;
    if(L.fr.length){ const hs=L.fr.map(e=>e.children[1].getBoundingClientRect().height); L.fr.forEach((e,i)=>{ e.style.verticalAlign='calc(0.26em - '+hs[i]+'px)'; }); }
    if(L.pw.length){
      const items=L.pw.map(e=>{ let p=e.previousElementSibling; while(p&&p.classList.contains('caret')) p=p.previousElementSibling; return {e,p}; }).filter(o=>o.p);
      items.forEach(o=>{ o.e.style.verticalAlign='0px'; });
      const m=items.map(o=>({pr:o.p.getBoundingClientRect(),r:o.e.getBoundingClientRect(),fs:parseFloat(getComputedStyle(o.e.parentNode).fontSize)}));
      items.forEach((o,i)=>{ const {pr,r,fs}=m[i]; o.e.style.verticalAlign=pr.height?(r.bottom-(pr.top+Math.min(pr.height*0.45,fs*0.55)))+'px':''; });

const mkNode=t=>{ const n={t}; for(const k of KIDS[t]) n[k]=[]; return n; };

function findParent(row,target){

    for(const k of kidsOf(n)){ if(k===target) return {prow:row,idx:i,node:n}; const r=findParent(k,target); if(r) return r; } }

class Editor{

    this.onChange=opts.onChange||(()=>{});

  }
  set(row){ this.root=row; this.cur={row,i:row.length}; this.changed(); }
  changed(){ this.autoParen=null; this.render(); this.onChange(this); }
  render(){
    const h=this.host; h.textContent='';
    const r=renderRow(this.root,active===this?this.cur:null); r.classList.add('rootrow'); h.appendChild(r); fix(r);
    h.classList.toggle('active',active===this);
    const c=h.querySelector('.caret');
    if(c){ const cr=c.getBoundingClientRect(),hr=h.getBoundingClientRect();
      if(cr.right>hr.right-8) h.scrollLeft+=cr.right-hr.right+28; else if(cr.left<hr.left+8) h.scrollLeft-=hr.left-cr.left+28; }
  }
  move(d){

    k=d===Infinity?ps.length-1:d===-Infinity?0:Math.max(0,Math.min(ps.length-1,k+d));
    this.cur={row:ps[k][0],i:ps[k][1]}; this.render();

        if(j<0) break; start=j; continue;
      }
      if(/^[0-9.a-zA-Zπ!%]$/.test(n.v)||n.v==='Ans'){ start--; continue; }

  }
  struct(t){
    const n=mkNode(t);

  letter(ch){
    const row=this.cur.row;
    if(ch==='h'){ const p=row[this.cur.i-1]; if(p&&p.t==='c'&&/^a?(sin|cos|tan)\($/.test(p.v)){ p.v=p.v.slice(0,-1)+'h('; return this.changed(); } }

        const a=TYPEDMAP[nm];

    let rowEl=e.target.closest('.row');
    while(rowEl&&!rowEl._row) rowEl=rowEl.parentElement&&rowEl.parentElement.closest('.row');
    if(!rowEl||!this.host.contains(rowEl)) this.cur={row:this.root,i:this.root.length};

function msg(t){ $('#err').textContent=t; }

    : e&&e.kind==='dim' ? 'Type error: matrix sizes don’t fit this operation, or a matrix or complex number was used where a plain number is needed.'

const HMAX=200;   /* history kept in memory and on screen */
function pushHist(show,load,v,src,example){
  const it={show,load,v,src,useExact:!S.dec,view:null,example};
  hist.push(it);
  if(!(v&&v.sol)&&typeof v!=='boolean') V.Ans=v;
  if(hist.length>HMAX){ hist.splice(0,hist.length-HMAX); }
  /* append just the new line instead of rebuilding the whole list */
  const h=$('#hist');
  if(histStale||!h.getClientRects().length){ histStale=true; updStatus(); return; }
  { const d=histItem(it); h.appendChild(d); d._fill(); } while(h.children.length>hist.length) h.firstChild.remove();
  h.scrollTop=h.scrollHeight; updStatus();
}
function resRow(it){
  const v=it.v;
  if(it.view==='dms'&&isN(v)) return dmsRow(v);
  if(typeof it.view==='number'&&isN(v)) return baseRow(v,it.view);
  return valueRow(v,{exact:it.useExact&&S.fmt==='norm'&&it.view!=='sci',src:it.src,sci:it.view==='sci'});

let histStale=false;
function histItem(it){
  const d=el('div','hitem'), ex=el('div','hexpr'), rs=el('div','hres');
  ex.title='Edit this expression again';

  d.append(ex,rs);

/* rebuild the history; while it is hidden (another tab on a phone) only mark it, and rebuild when it is shown */
function renderHist(){

  histStale=false; h.textContent='';
  const items=hist.map(it=>{ const d=histItem(it); h.appendChild(d); return d; });
  const roots=[]; items.forEach(d=>d._fill(roots)); fix(roots);   /* one batched alignment pass for the whole list */

function short(v){

  if(isC(v)) return short(v.re)+(v.im<0?' − ':' + ')+short(Math.abs(v.im))+'i';

function updStatus(){
  const a=S.ang.toUpperCase();
  $('#angleChip').textContent=a;
  const k=$('#kAngle'); if(k) k.querySelector('.k1').textContent=a;
  $('#modeChip').textContent=S.dec?'Answers: decimal':'Answers: exact';
  $('#fmtChip').textContent=S.fmt==='norm'?'NORM':S.fmt.toUpperCase()+' '+S.digits;
  $('#cplxChip').textContent=S.cplx?'CPLX on':'CPLX off'; $('#cplxChip').classList.toggle('on',S.cplx);
  $('#stoChip').hidden=!stoPending; $('#hypChip').hidden=!hyp;

function setting(k,v){ S[k]=v; renderHist(); drawSoon(); save(); }

  if(!mainEd.root.length) return;

/* value of the entry line, or the last answer when the entry is empty */
function currentValue(){

  if(hist.length) return {row:[C('Ans')],v:V.Ans};

    const {row,v}=cv;
    if(mode){ V.M=add(V.M,v,mode); pushHist([...row,C(mode>0?' M+':' M−')],row,v,ser(row)); }
    else{ V[name]=v; pushHist([...row,C('→'),C(name)],row,v,ser(row)); }

function act(a){
  const ed=active;
  if(a==='shift'){ shift=!shift; updKeys(); return; }
  if(a==='sto'){ stoPending=!stoPending; shift=false; updKeys(); updStatus(); return; }
  if(a==='hyp'){ hyp=!hyp; shift=false; updKeys(); updStatus(); return; }
  const wasSto=stoPending;
  if(wasSto&&/^c:[ABCDxyM]$/.test(a)){ store(a.slice(2)); if(shift){ shift=false; updKeys(); } return; }
  if(wasSto){ stoPending=false; updStatus(); }
  const k=a.slice(0,2); let v=a.slice(2);
  if(k==='c:'){ if(/^([+×÷!%]|mod)$/.test(v)) autoAns(ed); ed.type(v); }
  else if(k==='f:'){ if(hyp&&/^a?(sin|cos|tan)$/.test(v)) v+='h'; ed.type(v+'('); }
  else if(k==='s:'){ if(v==='pow'||v==='frac') autoAns(ed); ed.struct(v); }
  else if(k==='t:') openTools(v);

    case 'del': ed.back(); break;
    case 'ac': ed.set([]); break;
    case 'eq': equals(); break;
    case 'rel': relKey(ed); break;
    case 'neg': negate(ed); break;
    case 'dms': dmsKey(ed); break;
    case 'drg': cycleAngle(false); break;
    case 'drgconv': cycleAngle(true); break;
    case 'fse': S.fmt=FMT[(FMT.indexOf(S.fmt)+1)%4]; setting('fmt',S.fmt); break;
    case 'xe': toggleView('sci'); break;
    case 'cplx': setting('cplx',!S.cplx); break;
    case 'mplus': store('M',1); break;

document.addEventListener('keydown',e=>{
  if(e.target.matches&&e.target.matches('input,textarea,select')) return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(!$('#tools').hidden){ if(e.key==='Escape') closeTools(); return; }
  const k=e.key, ed=active; let done=true;
  if(/^[0-9.]$/.test(k)) act('c:'+k);
  else if(k==='+') act('c:+');
  else if(k==='-') act('c:−');
  else if(k==='*') act('c:×');
  else if(k==='/') act('s:frac');
  else if(k==='^') act('s:pow');
  else if('(),!%<>'.includes(k)&&k.length===1) act('c:'+k);
  else if(k==='|') act('s:abs');
  else if(k==='=') { if(ed.rel) ed.type('='); else act('eq'); }
  else if(k==='Enter') act('eq');
  else if(k==='Backspace') act('del');
  else if(k==='Escape') act('ac');
  else if(k==='ArrowLeft') ed.move(-1);
  else if(k==='ArrowRight') ed.move(1);
  else if(k==='Home') ed.move(-Infinity);
  else if(k==='End') ed.move(Infinity);
  else if(/^[ABCDM]$/.test(k)) act('c:'+k);
  else if(k==='X'||k==='Y') act('c:'+k.toLowerCase());
  else if(/^[a-z]$/.test(k)){ if(stoPending&&(k==='x'||k==='y')) act('c:'+k); else { stoPending=false; updStatus(); ed.letter(k); } }
  else done=false;
  if(done) e.preventDefault();
});

function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/p; return (m<=1?1:m<=2?2:m<=5?5:10)*p; }
function tickLabel(v,step){

  const s=(Math.abs(v)>=1e5||dec>5)?Number(v.toPrecision(6)).toExponential():v.toFixed(dec);

}
function coord(v,unitsPerPx){
  if(Math.abs(v)<unitsPerPx/100) return '0';
  const d=Math.max(0,Math.min(9,Math.ceil(-Math.log10(unitsPerPx))+1));
  const s=(Math.abs(v)>=1e6||Math.abs(v)<1e-5)?v.toExponential(3):String(parseFloat(v.toFixed(d)));
  return s.replace('-','−');
}
let drawQueued=false;
function drawSoon(){ if(drawQueued) return; drawQueued=true; requestAnimationFrame(()=>{ drawQueued=false; draw(); }); }

function draw(){
  if(!W||!H) return;
  const cs=getComputedStyle(document.documentElement), css=n=>cs.getPropertyValue(n).trim();
  const oldX=V.x, sx=(view.x1-view.x0)/W, sy=(view.y1-view.y0)/H;
  CMODE=false;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=css('--plot-bg'); ctx.fillRect(0,0,W,H);
  const stx=niceStep(sx*80), sty=niceStep(sy*80);
  const lines=(step,color,vert)=>{
    ctx.strokeStyle=color; ctx.lineWidth=1; ctx.beginPath();
    if(vert) for(let v=Math.ceil(view.x0/step)*step;v<=view.x1;v+=step){ const p=Math.round(X(v))+.5; ctx.moveTo(p,0); ctx.lineTo(p,H); }
    else for(let v=Math.ceil(view.y0/step)*step;v<=view.y1;v+=step){ const p=Math.round(Y(v))+.5; ctx.moveTo(0,p); ctx.lineTo(W,p); }
    ctx.stroke();
  };
  const minor=s=>{ const m=s/Math.pow(10,Math.floor(Math.log10(s)+1e-9)); return s/(Math.round(m)===2?4:5); };
  lines(minor(stx),css('--grid2'),true); lines(minor(sty),css('--grid2'),false);
  lines(stx,css('--grid'),true); lines(sty,css('--grid'),false);
  const ax=Math.round(X(0))+.5, ay=Math.round(Y(0))+.5;
  ctx.strokeStyle=css('--axis'); ctx.lineWidth=1.2; ctx.beginPath();
  if(ax>=0&&ax<=W){ ctx.moveTo(ax,0); ctx.lineTo(ax,H); }
  if(ay>=0&&ay<=H){ ctx.moveTo(0,ay); ctx.lineTo(W,ay); }
  ctx.stroke();
  ctx.fillStyle=css('--muted'); ctx.font='11px "IBM Plex Sans",system-ui,sans-serif';
  const ly=Math.max(4,Math.min(H-16,ay+4)); ctx.textAlign='center'; ctx.textBaseline='top';
  for(let v=Math.ceil(view.x0/stx)*stx;v<=view.x1;v+=stx){ if(Math.abs(v)<stx/1e6) continue; ctx.fillText(tickLabel(v,stx),X(v),ly); }
  ctx.textBaseline='middle';
  const leftSide=ax<40; ctx.textAlign=leftSide?'left':'right';
  const lx=leftSide?Math.max(4,ax+5):Math.min(W-4,ax-5);
  for(let v=Math.ceil(view.y0/sty)*sty;v<=view.y1;v+=sty){ if(Math.abs(v)<sty/1e6) continue; ctx.fillText(tickLabel(v,sty),lx,Y(v)); }

  /* curves */
  const n=Math.ceil(W)+1; samples=[];
  fns.forEach((o,fi)=>{
    if(!o.on||!o.f){ samples.push(null); return; }
    const ys=new Float64Array(n), f=o.f;
    ctx.strokeStyle=css('--c'+(fi%5+1)); ctx.lineWidth=2; ctx.lineJoin='round'; ctx.beginPath();
    let pen=false, py=0, pY=0;
    for(let i=0;i<n;i++){
      const x=view.x0+i*sx; V.x=x; const y=realOf(f);
      ys[i]=y;
      if(!Number.isFinite(y)){ pen=false; continue; }
      const Yp=Math.max(-1e4,Math.min(1e4,Y(y)));
      if(pen&&Math.abs(Yp-pY)>H*0.4){

      const xa=view.x0+i*sx;

      else if(a*b<0){ const r=bisect(g,xa,xa+sx); if(Number.isFinite(r)&&Math.abs(g(r))<yr*1e-6) mine.push({x:r,y:0,kind:'root',fi}); }
      if(i>0){ const c=ys[i-1]; if(Number.isFinite(c)&&(a-c)*(b-a)<0){
        const isMax=a>c; let lo=xa-sx,hi=xa+sx; const ph=(Math.sqrt(5)-1)/2;
        for(let k=0;k<45;k++){ const m1=hi-ph*(hi-lo),m2=lo+ph*(hi-lo); const v1=g(m1),v2=g(m2); if(isMax?(v1>v2):(v1<v2)) hi=m2; else lo=m1; }
        const xm=(lo+hi)/2, ym=g(xm);

      } }
    }
    if(view.x0<0&&view.x1>0){ const y0=g(0); if(Number.isFinite(y0)&&y0!==0) mine.push({x:0,y:y0,kind:'y-intercept',fi}); }
    if(mine.length<40) pois.push(...mine);
    for(let fj=fi+1;fj<fns.length;fj++){
      const zs=samples[fj]; if(!zs) continue; const f2=fns[fj].f, h=x=>ev(f,x)-ev(f2,x), mine2=[];

    ctx.strokeStyle=p.kind==='intersection'?css('--ink'):css('--c'+(p.fi%5+1)); ctx.lineWidth=1.5; ctx.stroke();
  });
  V.x=oldX;
  drawOver(); syncWin();
}
function drawOver(){
  octx.setTransform(dpr,0,0,dpr,0,0); octx.clearRect(0,0,W,H);
  if(!trace) return;
  const cs=getComputedStyle(document.documentElement), css=n=>cs.getPropertyValue(n).trim();
  const px=X(trace.x), py=Y(trace.y), sx=(view.x1-view.x0)/W, sy=(view.y1-view.y0)/H;
  octx.beginPath(); octx.arc(px,py,5,0,7); octx.fillStyle=css('--c'+(trace.fi%5+1)); octx.fill();
  octx.strokeStyle=css('--plot-bg'); octx.lineWidth=2; octx.stroke();
  const t=(trace.kind?trace.kind+'  ':'')+'('+coord(trace.x,sx)+', '+coord(trace.y,sy)+')';
  octx.font='500 12px "IBM Plex Sans",system-ui,sans-serif';
  const w=octx.measureText(t).width+14; let bx=px+10, by=py-30;
  if(bx+w>W-4) bx=px-10-w; if(bx<4) bx=4; if(by<4) by=py+12;
  octx.fillStyle=css('--chassis'); octx.strokeStyle=css('--line'); octx.lineWidth=1;
  octx.beginPath(); octx.rect(Math.round(bx)+.5,Math.round(by)+.5,w,22); octx.fill(); octx.stroke();
  octx.fillStyle=css('--ink'); octx.textBaseline='middle'; octx.textAlign='left'; octx.fillText(t,bx+7,by+11.5);
}
function hover(px,py){
  let best=null, bd=14;
  for(const p of pois){ const d=Math.hypot(X(p.x)-px,Y(p.y)-py); if(d<bd){ bd=d; best=p; } }
  if(!best){
    const x=view.x0+px*(view.x1-view.x0)/W, old=V.x; let d0=40; CMODE=false;
    fns.forEach((o,fi)=>{ if(!o.on||!o.f) return; V.x=x; const y=realOf(o.f); if(!Number.isFinite(y)) return; const d=Math.abs(Y(y)-py); if(d<d0){ d0=d; best={x,y,fi,kind:''}; } });

function zoomAt(px,py,k){
  const w=view.x1-view.x0, h=view.y1-view.y0;
  if((k<1&&(w<1e-9||h<1e-9))||(k>1&&(w>1e9||h>1e9))) return;
  const cx0=view.x0+px/W*w, cy=view.y1-py/H*h;
  view={x0:cx0-(cx0-view.x0)*k,x1:cx0+(view.x1-cx0)*k,y0:cy-(cy-view.y0)*k,y1:cy+(view.y1-cy)*k};
  trace=null; draw(); save();
}
function home(){ const yh=10*H/W; view={x0:-10,x1:10,y0:-yh,y1:yh}; trace=null; draw(); save(); }
function square(){ const cy=(view.y0+view.y1)/2, yh=(view.x1-view.x0)/W*H/2; view.y0=cy-yh; view.y1=cy+yh; trace=null; draw(); save(); }

const ptrs=new Map(); let moved=0, pinchD=0;
const rel=e=>{ const r=ov.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
ov.addEventListener('pointerdown',e=>{ ov.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,rel(e)); moved=0;
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinchD=Math.hypot(a.x-b.x,a.y-b.y); } });
ov.addEventListener('pointermove',e=>{
  const q=rel(e);
  if(!ptrs.has(e.pointerId)){ if(e.pointerType==='mouse') hover(q.x,q.y); return; }
  const p=ptrs.get(e.pointerId), dx=q.x-p.x, dy=q.y-p.y; ptrs.set(e.pointerId,q); moved+=Math.abs(dx)+Math.abs(dy);
  if(ptrs.size===1){
    if(moved<4) return;
    const ux=dx*(view.x1-view.x0)/W, uy=dy*(view.y1-view.y0)/H;
    view.x0-=ux; view.x1-=ux; view.y0+=uy; view.y1+=uy; trace=null; drawSoon();
  }else if(ptrs.size===2){
    const [a,b]=[...ptrs.values()], d=Math.hypot(a.x-b.x,a.y-b.y);
    if(pinchD>0&&d>0) zoomAt((a.x+b.x)/2,(a.y+b.y)/2,pinchD/d);
    pinchD=d;

});
const endPtr=e=>{ if(!ptrs.has(e.pointerId)) return; const q=rel(e), single=ptrs.size===1; ptrs.delete(e.pointerId);
  if(single&&moved<4&&e.type==='pointerup') hover(q.x,q.y); else if(single) save(); };
ov.addEventListener('pointerup',endPtr); ov.addEventListener('pointercancel',endPtr);
ov.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse'&&!ptrs.size){ trace=null; drawOver(); } });
ov.addEventListener('wheel',e=>{ e.preventDefault(); const q=rel(e); zoomAt(q.x,q.y,Math.exp(Math.max(-60,Math.min(60,e.deltaY))*0.004)); },{passive:false});
$('#zin').onclick=()=>zoomAt(W/2,H/2,1/1.5);
$('#zout').onclick=()=>zoomAt(W/2,H/2,1.5);

const WIN={wx0:'x0',wx1:'x1',wy0:'y0',wy1:'y1'};
function syncWin(){ if(!$('#win').classList.contains('open')) return; for(const id in WIN){ const i=$('#'+id); if(document.activeElement!==i) i.value=String(Number(view[WIN[id]].toPrecision(6))); } }

function resize(){

function cleanRow(row,depth=0){

  const out=[];
  for(const n of row.slice(0,400)){
    if(!n||typeof n!=='object') continue;
    if(n.t==='c'){ if(typeof n.v==='string'&&n.v.length&&n.v.length<=24) out.push({t:'c',v:n.v}); continue; }
    if(n.t==='mat'){ const r=n.r, c=n.c; if(Number.isInteger(r)&&Number.isInteger(c)&&r>=1&&c>=1&&r<=8&&c<=8&&Array.isArray(n.cells)&&n.cells.length===r*c) out.push({t:'mat',r,c,cells:n.cells.map(x=>cleanRow(x,depth+1))}); continue; }
    if(Object.prototype.hasOwnProperty.call(KIDS,n.t)){ const m={t:n.t}; KIDS[n.t].forEach(k=>{ m[k]=cleanRow(n[k],depth+1); }); out.push(m); }
  }
  return out;
}
function load(){ try{ const d=JSON.parse(localStorage.getItem('natcalc-v1')); if(!d||typeof d!=='object'||!Array.isArray(d.fns)) return false;
  const ds=d.S&&typeof d.S==='object'?d.S:null;
  if(ds){ for(const k of Object.keys(S)) if(Object.prototype.hasOwnProperty.call(ds,k)&&typeof ds[k]===typeof S[k]) S[k]=ds[k]; }
  else { S.ang=d.deg===false?'rad':'deg'; S.dec=!!d.dec; }
  if(!['system','light','dark'].includes(S.theme)) S.theme='system';
  if(!ANG.includes(S.ang)) S.ang='deg'; if(!FMT.includes(S.fmt)) S.fmt='norm'; if(!(Number.isInteger(S.digits)&&S.digits>=0&&S.digits<=9)) S.digits=4;
  d.fns.slice(0,6).forEach(f=>{ if(f&&typeof f==='object') fns.push({row:cleanRow(f.row),on:f.on!==false}); });
  const w=d.view, ok=w&&['x0','x1','y0','y1'].every(k=>Number.isFinite(w[k]));
  if(ok&&w.x0<w.x1&&w.y0<w.y1&&w.x1-w.x0>1e-12&&w.y1-w.y0>1e-12&&Math.abs(w.x0)<1e15&&Math.abs(w.x1)<1e15&&Math.abs(w.y0)<1e15&&Math.abs(w.y1)<1e15){ view={x0:w.x0,x1:w.x1,y0:w.y0,y1:w.y1}; viewLoaded=true; }
  return true; }catch(e){ return false; } }

/* ---------- start-up ---------- */
if(!load()){
  fns.push({row:[{t:'frac',a:[C('x'),{t:'pow',a:[C('3')]}],b:[C('8')]},C('−'),C('x')],on:true});
  fns.push({row:[{t:'sqrt',a:[C('x'),C('+'),C('5')]}],on:true});
}
applyTheme();
buildFnList();
{
  const keep={...S}; Object.assign(S,{ang:'deg',cplx:false,polar:false});
  [
    [{t:'frac',a:[C('1')],b:[C('3')]},C('+'),{t:'frac',a:[C('1')],b:[C('6')]}],
    [{t:'sqrt',a:[C('1'),C('8')]},C('×'),C('sin('),C('6'),C('0'),C(')')],
    [{t:'int',lo:[C('0')],hi:[C('2')],a:[C('x'),{t:'pow',a:[C('2')]}]}]
  ].forEach(row=>{ try{ pushHist(row,row,evaluate(row),ser(row),true); }catch(e){} });
  Object.assign(S,keep); renderHist();
}

function setView(v){
  $('#app').dataset.view=v; hideKeys();
  $('#tabCalc').setAttribute('aria-selected',v==='calc'); $('#tabGraph').setAttribute('aria-selected',v==='graph'); $('#tabSolve').setAttribute('aria-selected',v==='solve');
  if(v==='solve'){ if(window.solveShown) solveShown(); if(histStale) renderHist(); }
  else if(v==='graph'){ if(active===mainEd&&fns[0]) setActive(fns[0].ed); fns.forEach(o=>o.ed.render()); resize(); }
  else { setActive(mainEd); if(histStale) renderHist(); }
}
$('#tabCalc').onclick=()=>setView('calc');
$('#khide').onclick=hideKeys;
$('#over').addEventListener('pointerdown',hideKeys);
$('#tabGraph').onclick=()=>setView('graph');
$('#tabSolve').onclick=()=>setView('solve');
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ renderHist(); mainEd.render(); fns.forEach(o=>o.ed.render()); draw(); });
