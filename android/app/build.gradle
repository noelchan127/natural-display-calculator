plugins {
    id 'com.android.application'
}

// Release signing comes from environment variables (set by the GitHub workflow from repository secrets).
// Without them, the release build falls back to the debug key so it still installs for testing.
def keystorePath = System.getenv('ANDROID_KEYSTORE')
def hasReleaseKey = keystorePath != null && new File(keystorePath).exists()

android {
    namespace 'io.github.noelchan127.calculator'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.noelchan127.calculator'
        minSdk 24
        targetSdk 35
        // versionCode comes from the version number (1.2.3 -> 10203), so it always rises with VERSION and
        // doesn't depend on the CI run counter, which restarts if the workflow or repository is recreated.
        def appVersion = System.getenv('APP_VERSION') ?: '1.0.0'
        def parts = appVersion.tokenize('.').collect { it as int }
        versionCode parts[0] * 10000 + parts[1] * 100 + parts[2]
        versionName appVersion
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 removes unused library code (smaller APK); proguard-rules.pro keeps the page's haptics bridge.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    // The calculator page is built into web/dist by `npm ci && python3 build.py` in ../web.
    sourceSets {
        main {
            assets.srcDirs += ['../../web/dist']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
