name: Build apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default; only the two publishing jobs below get write access.
permissions:
  contents: read

jobs:
  web:
    name: Web page (single offline file)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read app version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(tr -d '[:space:]' < VERSION)"; fi
          # Later steps put the version into scripts, so accept nothing but plain numbers like 1.2.3.
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Version '$v' must look like 1.2.3"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "App version: $v"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: python3 build.py
        working-directory: web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web
          path: web/dist/index.html
          if-no-files-found: error

  windows:
    name: Windows (Tauri, WebView2)
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web
          path: web/dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: windows/src-tauri -> target
      - run: npm ci
        working-directory: windows
      - name: Set app version
        shell: pwsh
        working-directory: windows/src-tauri
        run: |
          $v = '${{ needs.web.outputs.version }}'
          $c = Get-Content tauri.conf.json -Raw | ConvertFrom-Json
          $c.version = $v
          $c | ConvertTo-Json -Depth 20 | Set-Content tauri.conf.json -Encoding utf8
      - run: npx tauri build --ci
        working-directory: windows
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item windows/src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item "windows/src-tauri/target/release/Natural Display Calculator.exe" "out/Natural Display Calculator (portable).exe"
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  android:
    name: Android (WebView)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web
          path: web/dist
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set; the APK is signed with a throwaway debug key and cannot update an installed release build."
          fi
      - name: Set app version
        env:
          V: ${{ needs.web.outputs.version }}
        run: echo "APP_VERSION=$V" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Natural-Display-Calculator.apk"
          ls -la out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    # A release is made for each new version: change VERSION and push to main, or push a v* tag.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [web, windows, android]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.web.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
      - name: Name the files
        run: |
          mkdir rel
          cp dist/windows/*-setup.exe "rel/Natural-Display-Calculator-$VERSION-Windows-setup.exe"
          cp dist/windows/*portable*.exe "rel/Natural-Display-Calculator-$VERSION-Windows-portable.exe"
          cp dist/android/*.apk "rel/Natural-Display-Calculator-$VERSION-Android.apk"
          cp dist/web/index.html "rel/Natural-Display-Calculator-$VERSION-offline.html"
          ls -la rel
      - name: Create or update the release
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              gh release upload "$tag" rel/* --clobber
            else
              echo "Release $tag already exists; change VERSION to publish a new one."
            fi
            exit 0
          fi
          cat > notes.md <<'EOF'
          ## Downloads

          | File | For |
          |---|---|
          | `…-Windows-setup.exe` | Windows 10 or 11, installs for your account (no admin rights needed) |
          | `…-Windows-portable.exe` | Windows 10 or 11, runs without installing |
          | `…-Android.apk` | Android 7.0 or newer |
          | `…-offline.html` | Any browser, no install |

          The Windows files are not code-signed, so SmartScreen warns the first time: choose **More info**, then **Run anyway**.
          On Android, allow installs from your browser or file manager when prompted. The app updates in place over earlier versions.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$tag" rel/* --target "$GITHUB_SHA" --title "Natural Display Calculator $VERSION" --notes-file notes.md --generate-notes

  builds-branch:
    name: Update builds branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, windows, android]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
      - name: Push latest builds to the 'builds' branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site && cd site
          cp ../dist/windows/* ../dist/android/* .
          cp ../dist/web/index.html "Natural-Display-Calculator-offline.html"
          cat > README.md <<EOF
          # Latest builds

          Built from commit ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC') by run #${GITHUB_RUN_NUMBER}.
          This branch is replaced on every push to main.
          EOF
          sed -i 's/^          //' README.md
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Builds from ${GITHUB_SHA::7} (run #${GITHUB_RUN_NUMBER})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds
