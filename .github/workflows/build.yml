name: Build apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Web page (single offline file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: python3 build.py
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web/dist/index.html
          if-no-files-found: error

  windows:
    name: Windows (Tauri, WebView2)
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri -> target
      - run: npm ci
        working-directory: windows
      - name: Set app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        working-directory: windows/src-tauri
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          $c = Get-Content tauri.conf.json -Raw | ConvertFrom-Json
          $c.version = $v
          $c | ConvertTo-Json -Depth 20 | Set-Content tauri.conf.json -Encoding utf8
      - run: npx tauri build --ci
        working-directory: windows
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item windows/src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item "windows/src-tauri/target/release/Natural Display Calculator.exe" "out/Natural Display Calculator (portable).exe"
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  android:
    name: Android (WebView)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web/dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set; the APK is signed with a throwaway debug key and cannot update an installed release build."
          fi
      - name: Set app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Collect files
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Natural-Display-Calculator.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Rename offline page
        run: mv dist/web/index.html "dist/web/Natural-Display-Calculator-offline.html"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/windows/*
            dist/android/*
            dist/web/*

  builds-branch:
    name: Update builds branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Push latest builds to the 'builds' branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site && cd site
          cp ../dist/windows/* ../dist/android/* .
          cp ../dist/web/index.html "Natural-Display-Calculator-offline.html"
          cat > README.md <<EOF
          # Latest builds

          Built from commit ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC') by run #${GITHUB_RUN_NUMBER}.
          This branch is replaced on every push to main.
          EOF
          sed -i 's/^          //' README.md
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Builds from ${GITHUB_SHA::7} (run #${GITHUB_RUN_NUMBER})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds
